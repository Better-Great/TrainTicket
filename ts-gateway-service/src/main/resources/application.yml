# HTTP Server
server:
  port: 18888  # HTTP (Tomcat) port

spring:
  main:
    web-application-type: reactive
  application:
    name: ts-gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
    gateway:
      routes:
        - id: admin-basic-info
          uri: lb://${ADMIN_BASIC_INFO_SERVICE_HOST:ts-admin-basic-info-service}
          predicates:
            - Path=/api/v1/adminbasicservice/**

        - id: admin-order
          uri: lb://${ADMIN_ORDER_SERVICE_HOST:ts-admin-order-service}
          predicates:
            - Path=/api/v1/adminorderservice/**

        - id: admin-route
          uri: lb://${ADMIN_ROUTE_SERVICE_HOST:ts-admin-route-service}
          predicates:
            - Path=/api/v1/adminrouteservice/**

        - id: admin-travel
          uri: lb://${ADMIN_TRAVEL_SERVICE_HOST:ts-admin-travel-service}
          predicates:
            - Path=/api/v1/admintravelservice/**

        - id: admin-user
          uri: lb://${ADMIN_USER_SERVICE_HOST:ts-admin-user-service}
          predicates:
            - Path=/api/v1/adminuserservice/users/**

        - id: assurance
          uri: ${ASSURANCE_SERVICE_URI:lb://ts-assurance-service}
          predicates:
            - Path=/api/v1/assuranceservice/**

        - id: auth
          uri: ${AUTH_SERVICE_URI:lb://ts-auth-service}
          predicates:
            - Path=/api/v1/auth/**

        - id: auth-user
          uri: ${AUTH_SERVICE_URI:lb://ts-auth-service}
          predicates:
            - Path=/api/v1/users/**

        - id: avatar
          uri: lb://${AVATAR_SERVICE_HOST:ts-avatar-service}
          predicates:
            - Path=/api/v1/avatar/**

        - id: basic
          uri: ${BASIC_SERVICE_URI:lb://ts-basic-service}
          predicates:
            - Path=/api/v1/basicservice/**

        - id: cancel
          uri: lb://${CANCEL_SERVICE_HOST:ts-cancel-service}
          predicates:
            - Path=/api/v1/cancelservice/**

        - id: config
          uri: ${CONFIG_SERVICE_URI:lb://ts-config-service}
          predicates:
            - Path=/api/v1/configservice/**

        - id: consign-price
          uri: lb://${CONSIGN_PRICE_SERVICE_HOST:ts-consign-price-service}
          predicates:
            - Path=/api/v1/consignpriceservice/**

        - id: consign
          uri: lb://${CONSIGN_SERVICE_HOST:ts-consign-service}
          predicates:
            - Path=/api/v1/consignservice/**

        - id: contacts
          uri: ${CONTACTS_SERVICE_URI:lb://ts-contacts-service}
          predicates:
            - Path=/api/v1/contactservice/**

        - id: execute
          uri: lb://${EXECUTE_SERVICE_HOST:ts-execute-service}
          predicates:
            - Path=/api/v1/executeservice/**

        - id: food
          uri: lb://${FOOD_SERVICE_HOST:ts-food-service}
          predicates:
            - Path=/api/v1/foodservice/**

        - id: inside-payment
          uri: ${INSIDE_PAYMENT_SERVICE_URI:lb://ts-inside-payment-service}
          predicates:
            - Path=/api/v1/inside_pay_service/**

        - id: notification
          uri: lb://${NOTIFICATION_SERVICE_HOST:ts-notification-service}
          predicates:
            - Path=/api/v1/notifyservice/**

        - id: order-other
          uri: lb://${ORDER_OTHER_SERVICE_HOST:ts-order-other-service}
          predicates:
            - Path=/api/v1/orderOtherService/**

        - id: order
          uri: ${ORDER_SERVICE_URI:lb://ts-order-service}
          predicates:
            - Path=/api/v1/orderservice/**

        - id: payment
          uri: ${PAYMENT_SERVICE_URI:lb://ts-payment-service}
          predicates:
            - Path=/api/v1/paymentservice/**

        - id: preserve-other
          uri: lb://${PRESERVE_OTHER_SERVICE_HOST:ts-preserve-other-service}
          predicates:
            - Path=/api/v1/preserveotherservice/**

        - id: preserve
          uri: ${PRESERVE_SERVICE_URI:lb://ts-preserve-service}
          predicates:
            - Path=/api/v1/preserveservice/**

        - id: price
          uri: ${PRICE_SERVICE_URI:lb://ts-price-service}
          predicates:
            - Path=/api/v1/priceservice/**

        - id: rebook
          uri: lb://${REBOOK_SERVICE_HOST:ts-rebook-service}
          predicates:
            - Path=/api/v1/rebookservice/**

        - id: route-plan
          uri: lb://${ROUTE_PLAN_SERVICE_HOST:ts-route-plan-service}
          predicates:
            - Path=/api/v1/routeplanservice/**

        - id: route
          uri: ${ROUTE_SERVICE_URI:lb://ts-route-service}
          predicates:
            - Path=/api/v1/routeservice/**

        - id: seat
          uri: ${SEAT_SERVICE_URI:lb://ts-seat-service}
          predicates:
            - Path=/api/v1/seatservice/**

        - id: security
          uri: ${SECURITY_SERVICE_URI:lb://ts-security-service}
          predicates:
            - Path=/api/v1/securityservice/**

        - id: station-food
          uri: lb://${STATION_FOOD_SERVICE_HOST:ts-station-food-service}
          predicates:
            - Path=/api/v1/stationfoodservice/**

        - id: station
          uri: ${STATION_SERVICE_URI:lb://ts-station-service}
          predicates:
            - Path=/api/v1/stationservice/**

        - id: train-food
          uri: lb://${TRAIN_FOOD_SERVICE_HOST:ts-train-food-service}
          predicates:
            - Path=/api/v1/trainfoodservice/**

        - id: train
          uri: ${TRAIN_SERVICE_URI:lb://ts-train-service}
          predicates:
            - Path=/api/v1/trainservice/**

        - id: travel2
          uri: lb://${TRAVEL2_SERVICE_HOST:ts-travel2-service}
          predicates:
            - Path=/api/v1/travel2service/**

        - id: travel-plan
          uri: lb://${TRAVEL_PLAN_SERVICE_HOST:ts-travel-plan-service}
          predicates:
            - Path=/api/v1/travelplanservice/**

        - id: travel
          uri: ${TRAVEL_SERVICE_URI:lb://ts-travel-service}
          predicates:
            - Path=/api/v1/travelservice/**

        - id: user
          uri: ${USER_SERVICE_URI:lb://ts-user-service}
          predicates:
            - Path=/api/v1/userservice/users/**

        - id: verification-code
          uri: ${VERIFICATION_CODE_SERVICE_URI:lb://ts-verification-code-service}
          predicates:
            - Path=/api/v1/verifycode/**

        - id: wait-order
          uri: ${WAIT_ORDER_SERVICE_URI:lb://ts-wait-order-service}
          predicates:
            - Path=/api/v1/waitorderservice/**

        - id: food-delivery
          uri: ${FOOD_DELIVERY_SERVICE_URI:lb://ts-food-delivery-service}
          predicates:
            - Path=/api/v1/fooddeliveryservice/**

        - id: voucher-api
          uri: http://${VOUCHER_SERVICE_HOST:ts-voucher-service}:${VOUCHER_SERVICE_PORT:16101}
          predicates:
            - Path=/api/v1/voucherservice/**
          filters:
            - RewritePath=/api/v1/voucherservice/voucher, /getVoucher

        - id: voucher-legacy
          uri: http://${VOUCHER_SERVICE_HOST:ts-voucher-service}:${VOUCHER_SERVICE_PORT:16101}
          predicates:
            - Path=/getVoucher

        - id: ticket-office-api
          uri: http://${TICKET_OFFICE_SERVICE_HOST:ts-ticket-office-service}:${TICKET_OFFICE_SERVICE_PORT:16108}
          predicates:
            - Path=/api/v1/ticketofficeservice/**
          filters:
            - RewritePath=/api/v1/ticketofficeservice/?(?<segment>.*), /office/$\{segment}

        - id: ticket-office-legacy
          uri: http://${TICKET_OFFICE_SERVICE_HOST:ts-ticket-office-service}:${TICKET_OFFICE_SERVICE_PORT:16108}
          predicates:
            - Path=/office/**

        - id: news-api
          uri: http://${NEWS_SERVICE_HOST:ts-news-service}:${NEWS_SERVICE_PORT:12862}
          predicates:
            - Path=/api/v1/newsservice/**
          filters:
            - RewritePath=/api/v1/newsservice/?(?<segment>.*), /

        - id: news-legacy
          uri: http://${NEWS_SERVICE_HOST:ts-news-service}:${NEWS_SERVICE_PORT:12862}
          predicates:
            - Path=/news-service/**
          filters:
            - RewritePath=/news-service/?(?<segment>.*), /
