# HTTP Server
server:
  port: 12346  # HTTP (Tomcat) port

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-travel-service
  datasource:
    url: jdbc:mysql://${TRAVEL_MYSQL_HOST:127.0.0.1}:${TRAVEL_MYSQL_PORT:3307}/${TRAVEL_MYSQL_DATABASE:ts-travel-mysql}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${TRAVEL_MYSQL_USER:root}
    password: ${TRAVEL_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

swagger:
  controllerPackage: travel.controller

# Cluster defaults = service DNS; local scripts set *_SERVICE_HOST=127.0.0.1
BasicServiceHost: ${BASIC_SERVICE_HOST:ts-basic-service}
BasicServicePort: ${BASIC_SERVICE_PORT:15680}
TrainServiceHost: ${TRAIN_SERVICE_HOST:ts-train-service}
TrainServicePort: ${TRAIN_SERVICE_PORT:14567}
RouteServiceHost: ${ROUTE_SERVICE_HOST:ts-route-service}
RouteServicePort: ${ROUTE_SERVICE_PORT:11178}
SeatServiceHost: ${SEAT_SERVICE_HOST:ts-seat-service}
SeatServicePort: ${SEAT_SERVICE_PORT:18898}
OrderServiceHost: ${ORDER_SERVICE_HOST:ts-order-service}
OrderServicePort: ${ORDER_SERVICE_PORT:12031}
