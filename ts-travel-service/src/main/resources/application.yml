# HTTP Server
server:
  port: 12346  # HTTP (Tomcat) port

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-travel-service
  datasource:
    url: jdbc:mysql://${TRAVEL_MYSQL_HOST:127.0.0.1}:${TRAVEL_MYSQL_PORT:3307}/${TRAVEL_MYSQL_DATABASE:ts-travel-mysql}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${TRAVEL_MYSQL_USER:root}
    password: ${TRAVEL_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

swagger:
  controllerPackage: travel.controller

# Peer hosts for RestTemplate (must match @Value names in TravelServiceImpl)
BasicServiceHost: 127.0.0.1
BasicServicePort: 15680
TrainServiceHost: 127.0.0.1
TrainServicePort: 14567
RouteServiceHost: 127.0.0.1
RouteServicePort: 11178
SeatServiceHost: 127.0.0.1
SeatServicePort: 18898
OrderServiceHost: 127.0.0.1
OrderServicePort: 12031
