worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # All API traffic goes through the gateway (single north-south entry).
    location /api/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $ts_gateway http://ts-gateway-service:18888;
      proxy_pass $ts_gateway;
    }

    location = /getVoucher {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $ts_gateway http://ts-gateway-service:18888;
      proxy_pass $ts_gateway;
    }

    location /office/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $ts_gateway http://ts-gateway-service:18888;
      proxy_pass $ts_gateway;
    }

    location /news-service/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $ts_gateway http://ts-gateway-service:18888;
      proxy_pass $ts_gateway;
    }

    # Legacy Vue2/jQuery/AngularJS UI (parity reference until SPA complete).
    location /legacy/ {
      alias /usr/share/nginx/html/legacy/;
      index index.html;
      try_files $uri $uri/ /legacy/index.html;
    }

    # Modern SPA (Bun + Vue 3).
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
