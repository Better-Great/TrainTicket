server.port=${CancelServicePort}
spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
spring.application.name=ts-cancel-service
swagger.controllerPackage=cancel.controller

# Service URLs for inter-service communication (matching dev.application.ini pattern)
order-service.url=http://${OrderServiceHost}:${OrderServicePort}
order-other-service.url=http://${OrderOtherServiceHost}:${OrderOtherServicePort}
notification-service.url=http://${NotificationServiceHost}:${NotificationServicePort}
inside-payment-service.url=http://${InsidePaymentServiceHost}:${InsidePaymentServicePort}
user-service.url=http://${UserServiceHost}:${UserServicePort}