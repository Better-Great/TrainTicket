# HTTP Server
server:
  port: 14568  # HTTP (Tomcat) port

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-preserve-service
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

swagger:
  controllerPackage: preserve.controller

# Cluster defaults = K8s/Nacos service names; local scripts export 127.0.0.1
BasicServiceHost: ${BASIC_SERVICE_HOST:ts-basic-service}
BasicServicePort: ${BASIC_SERVICE_PORT:15680}
SeatServiceHost: ${SEAT_SERVICE_HOST:ts-seat-service}
SeatServicePort: ${SEAT_SERVICE_PORT:18898}
UserServiceHost: ${USER_SERVICE_HOST:ts-user-service}
UserServicePort: ${USER_SERVICE_PORT:12342}
AssuranceServiceHost: ${ASSURANCE_SERVICE_HOST:ts-assurance-service}
AssuranceServicePort: ${ASSURANCE_SERVICE_PORT:18888}
StationServiceHost: ${STATION_SERVICE_HOST:ts-station-service}
StationServicePort: ${STATION_SERVICE_PORT:12345}
SecurityServiceHost: ${SECURITY_SERVICE_HOST:ts-security-service}
SecurityServicePort: ${SECURITY_SERVICE_PORT:11188}
TravelServiceHost: ${TRAVEL_SERVICE_HOST:ts-travel-service}
TravelServicePort: ${TRAVEL_SERVICE_PORT:12346}
ContactsServiceHost: ${CONTACTS_SERVICE_HOST:ts-contacts-service}
ContactsServicePort: ${CONTACTS_SERVICE_PORT:12347}
OrderServiceHost: ${ORDER_SERVICE_HOST:ts-order-service}
OrderServicePort: ${ORDER_SERVICE_PORT:12031}
FoodServiceHost: ${FOOD_SERVICE_HOST:ts-food-service}
FoodServicePort: ${FOOD_SERVICE_PORT:18856}
ConsignServiceHost: ${CONSIGN_SERVICE_HOST:ts-consign-service}
ConsignServicePort: ${CONSIGN_SERVICE_PORT:16111}
