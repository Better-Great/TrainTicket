server.port=${Travel2ServicePort}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
spring.application.name=ts-travel2-service
spring.datasource.url=jdbc:mysql://${Travel2MysqlHost}:${Travel2MysqlPort}/${Travel2MysqlDatabase}?useSSL=false
spring.datasource.username=${Travel2MysqlUser}
spring.datasource.password=${Travel2MysqlPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
swagger.controllerPackage=travel2.controller