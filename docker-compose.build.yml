
# Build and run app images on the same network as minimal deps (nacos, mysql, …).
# From repo root (set IMG_REPO=bettergreat and IMG_TAG in .env for Docker Hub):
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml push    # after: docker login
#   docker compose -f docker-compose.build.yml up -d
#
# docker-compose.minimal.yml is included so services that depend_on nacos/mysql validate.
# You can still merge explicitly: -f docker-compose.minimal.yml -f docker-compose.build.yml
#
# Uses properties/${ENVIRONMENT}.application.ini (default: docker.application.ini for Docker network).

include:
  - docker-compose.minimal.yml

services:
  ts-auth-service:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.Ts.Auth.Service
    image: ${IMG_REPO}/ts-auth-service:${IMG_TAG}
    container_name: ts-auth-service
    mem_limit: 512m
    cpus: 0.5
    env_file: .env
    volumes:
      - ./properties:/app/external-config:ro
      - ./log/ts-auth-service:/app/logs
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      TZ: ${TZ:-UTC}
      PORT: ${AUTH_SERVICE_PORT:-12349}
    ports:
      - "${AUTH_SERVICE_PORT:-12349}:12349"
    networks:
      - trainticket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  ts-admin-basic-info-service:
