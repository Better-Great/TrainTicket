
# Build and run ts-auth-service on the same network as minimal deps.
# From repo root:
#   docker compose -f docker-compose.minimal.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.minimal.yml -f docker-compose.build.yml up -d
#
# Uses properties/${ENVIRONMENT}.application.ini (default: docker.application.ini for Docker network).

services:
  ts-auth-service:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.Ts.Auth.Service
    image: ts-auth-service:latest
    container_name: ts-auth-service
    env_file: .env
    volumes:
      - ./properties:/app/external-config:ro
      - ./log/ts-auth-service:/app/logs
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      TZ: ${TZ:-UTC}
      PORT: ${AUTH_SERVICE_PORT:-12349}
    ports:
      - "${AUTH_SERVICE_PORT:-12349}:12349"
    networks:
      - trainticket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  ts-admin-basic-info-service:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.Ts.Admin.Basic.Info.Service
