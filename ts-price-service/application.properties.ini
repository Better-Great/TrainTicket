spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.application.name=ts-price-service
spring.datasource.url=jdbc:mysql://${PriceMysqlHost}:${PriceMysqlPort}/${PriceMysqlDatabase}?useSSL=false
spring.datasource.username=${PriceMysqlUser}
spring.datasource.password=${PriceMysqlPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=${PriceServicePort}
swagger.controllerPackage=price.controller