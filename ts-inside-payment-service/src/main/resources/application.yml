server:
  port: 18673

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-inside-payment-service
  datasource:
    url: jdbc:mysql://${INSIDE_PAYMENT_MYSQL_HOST:127.0.0.1}:${INSIDE_PAYMENT_MYSQL_PORT:3307}/${INSIDE_PAYMENT_MYSQL_DATABASE:ts-inside-payment-mysql}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${INSIDE_PAYMENT_MYSQL_USER:root}
    password: ${INSIDE_PAYMENT_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

swagger:
  controllerPackage: inside_payment.controller

OrderServiceHost: ${ORDER_SERVICE_HOST:ts-order-service}
OrderServicePort: ${ORDER_SERVICE_PORT:12031}
OrderOtherServiceHost: ${ORDER_OTHER_SERVICE_HOST:ts-order-other-service}
OrderOtherServicePort: ${ORDER_OTHER_SERVICE_PORT:12032}
PaymentServiceHost: ${PAYMENT_SERVICE_HOST:ts-payment-service}
PaymentServicePort: ${PAYMENT_SERVICE_PORT:19001}
