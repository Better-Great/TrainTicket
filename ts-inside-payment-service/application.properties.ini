server.port=${InsidePaymentServicePort}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
spring.application.name=ts-inside-payment-service
spring.datasource.url=jdbc:mysql://${InsidePaymentMysqlHost}:${InsidePaymentMysqlPort}/${InsidePaymentMysqlDatabase}?useSSL=false
spring.datasource.username=${InsidePaymentMysqlUser}
spring.datasource.password=${InsidePaymentMysqlPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.redis.host=${RedisHost}
spring.redis.port=${RedisPort}
swagger.controllerPackage=inside_payment.controller