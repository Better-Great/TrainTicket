version: "3.8"

services:
  # Service Discovery
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=embedded
    ports:
      - "8848:8848"
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: trainticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # Gateway Service
  ts-gateway-service:
    build: ./ts-gateway-service
    container_name: ts-gateway-service
    ports:
      - "18888:18888"
    environment:
      NACOS_ADDRS: "nacos:8848"
    networks:
      - trainticket-net
    depends_on:
      nacos:
        condition: service_healthy
    restart: on-failure

  # Auth Service
  ts-auth-service:
    build: ./ts-auth-service
    container_name: ts-auth-service
    ports:
      - "12340:12340"
    environment:
      NACOS_ADDRS: "nacos:8848"
      AUTH_MYSQL_HOST: "mysql"
      AUTH_MYSQL_PORT: "3306"
      AUTH_MYSQL_DATABASE: "ts_auth_mysql"
      AUTH_MYSQL_USER: "root"
      AUTH_MYSQL_PASSWORD: "root"
    networks:
      - trainticket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  # User Service
  ts-user-service:
    build: ./ts-user-service
    container_name: ts-user-service
    ports:
      - "12342:12342"
    environment:
      NACOS_ADDRS: "nacos:8848"
      USER_MYSQL_HOST: "mysql"
      USER_MYSQL_PORT: "3306"
      USER_MYSQL_DATABASE: "ts_user_mysql"
      USER_MYSQL_USER: "root"
      USER_MYSQL_PASSWORD: "root"
    networks:
      - trainticket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  # Verification Code Service
  ts-verification-code-service:
    build: ./ts-verification-code-service
    container_name: ts-verification-code-service
    ports:
      - "15678:15678"
    environment:
      NACOS_ADDRS: "nacos:8848"
    networks:
      - trainticket-net
    depends_on:
      nacos:
        condition: service_healthy
    restart: on-failure

  # UI Dashboard
  ts-ui-dashboard:
    build: ./ts-ui-dashboard
    container_name: ts-ui-dashboard
    ports:
      - "8080:8080"
    networks:
      - trainticket-net
    depends_on:
      - ts-gateway-service
    restart: on-failure

networks:
  trainticket-net:
    driver: bridge

volumes:
  mysql-data:

