# Lean infra for packing many TrainTicket services on ~8GiB hosts.
# Kafka/Zipkin are opt-in: docker compose -f docker-compose.minimal.yml --profile full-infra up -d

services:
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-standalone
    # Image defaults JVM_XMN=512m / JVM_MMS=320m which OOMs under a 512m cap
    mem_limit: 640m
    cpus: 0.5
    environment:
      MODE: ${NACOS_MODE}
      SPRING_DATASOURCE_PLATFORM: ${SPRING_DATASOURCE_PLATFORM}
      NACOS_HTTP_PORT: ${NACOS_HTTP_PORT}
      NACOS_GRPC_PORT: ${NACOS_GRPC_PORT}
      NACOS_P2P_PORT: ${NACOS_P2P_PORT}
      # Keep Nacos itself lean on small hosts (must set XMN/MMS; image defaults are huge)
      JVM_XMS: ${NACOS_JVM_XMS:-128m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-64m}
      JVM_MS: ${NACOS_JVM_MS:-64m}
      JVM_MMS: ${NACOS_JVM_MMS:-128m}
    ports:
      - "${NACOS_HTTP_PORT}:${NACOS_HTTP_PORT}"
      - "${NACOS_GRPC_PORT}:${NACOS_GRPC_PORT}"
      - "${NACOS_P2P_PORT}:${NACOS_P2P_PORT}"
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NACOS_HTTP_PORT}/nacos"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mysql:
    image: mysql:8.0
    container_name: trainticket-mysql
    mem_limit: 640m
    cpus: 0.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${MYSQL_INIT_SCRIPT}:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >-
      --default-authentication-plugin=mysql_native_password
      --port=${MYSQL_PORT}
      --innodb-buffer-pool-size=256M
      --performance-schema=OFF
      --table-open-cache=200

  rabbitmq:
    # Management UI image is heavier; still fine with a hard mem cap.
    image: rabbitmq:3-management-alpine
    container_name: trainticket-rabbitmq
    mem_limit: 256m
    cpus: 0.25
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODE_PORT: ${RABBITMQ_AMQP_PORT}
    ports:
      - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
      - "${RABBITMQ_HTTP_PORT}:15672"
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: trainticket-redis
    mem_limit: 64m
    cpus: 0.1
    command: redis-server --port ${REDIS_PORT} --maxmemory 48mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - trainticket-net

  kafka:
    profiles: ["full-infra"]
    image: spotify/kafka:latest
    container_name: trainticket-kafka
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "${ZOOKEEPER_PORT}:${ZOOKEEPER_PORT}"
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    networks:
      - trainticket-net

  zipkin:
    profiles: ["full-infra"]
    image: openzipkin/zipkin:latest
    container_name: trainticket-zipkin
    mem_limit: 384m
    cpus: 0.25
    ports:
      - "${ZIPKIN_PORT}:${ZIPKIN_PORT}"
    networks:
      - trainticket-net

networks:
  trainticket-net:
    driver: bridge

volumes:
  mysql-data:
