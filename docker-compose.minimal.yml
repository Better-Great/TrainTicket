# Minimal compose: dependency services only (mysql, nacos, rabbitmq, kafka, zipkin, redis).
# Application services run separately (local or full compose).
# All values from .env - nothing hardcoded.

services:
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-standalone
    environment:
      MODE: ${NACOS_MODE}
      SPRING_DATASOURCE_PLATFORM: ${SPRING_DATASOURCE_PLATFORM}
      NACOS_HTTP_PORT: ${NACOS_HTTP_PORT}
      NACOS_GRPC_PORT: ${NACOS_GRPC_PORT}
      NACOS_P2P_PORT: ${NACOS_P2P_PORT}
    ports:
      - "${NACOS_HTTP_PORT}:${NACOS_HTTP_PORT}"
      - "${NACOS_GRPC_PORT}:${NACOS_GRPC_PORT}"
      - "${NACOS_P2P_PORT}:${NACOS_P2P_PORT}"
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NACOS_HTTP_PORT}/nacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: trainticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${MYSQL_INIT_SCRIPT}:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --port=${MYSQL_PORT}

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trainticket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODE_PORT: ${RABBITMQ_AMQP_PORT}
    ports:
      - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
      - "${RABBITMQ_HTTP_PORT}:15672"
    networks:
      - trainticket-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: trainticket-redis
    command: redis-server --port ${REDIS_PORT}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - trainticket-net

  kafka:
    image: spotify/kafka:latest
    container_name: trainticket-kafka
    ports:
      - "${ZOOKEEPER_PORT}:${ZOOKEEPER_PORT}"
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    networks:
      - trainticket-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: trainticket-zipkin
    ports:
      - "${ZIPKIN_PORT}:${ZIPKIN_PORT}"
    networks:
      - trainticket-net

networks:
  trainticket-net:
    driver: bridge

volumes:
  mysql-data:
