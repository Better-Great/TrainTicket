databaseChangeLog:
  - changeSet:
      id: create-ts-config-database
      author: devops
      comment: Create database for ts-config-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-config-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-config-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

