databaseChangeLog:
  - changeSet:
      id: create-config-table
      author: devops
      comment: Create config table for ts-config-service
      changes:
        - createTable:
            tableName: config
            catalogName: ts-config-mysql
            columns:
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: value
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: true

