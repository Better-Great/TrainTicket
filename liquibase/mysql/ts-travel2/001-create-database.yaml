databaseChangeLog:
  - changeSet:
      id: create-ts-travel2-database
      author: devops
      comment: Create database for ts-travel2-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-travel2-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-travel2-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
