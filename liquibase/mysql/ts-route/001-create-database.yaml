databaseChangeLog:
  - changeSet:
      id: create-ts-route-database
      author: devops
      comment: Create database for ts-route-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-route-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-route-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
