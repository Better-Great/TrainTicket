databaseChangeLog:
  - changeSet:
      id: create-ts-assurance-database
      author: devops
      comment: Create database for ts-assurance-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-assurance-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-assurance-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

