databaseChangeLog:
  # ============================================================================
  # Create tables for ts-station-service
  # ============================================================================
  # Based on fdse.microservice.entity.Station:
  # - id (String/UUID), name (unique), stayTime (int)
  # ============================================================================

  - changeSet:
      id: create-station-table
      author: devops
      comment: Create station table for ts-station-service
      changes:
        - createTable:
            tableName: station
            catalogName: ts-station-mysql
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: stay_time
                  type: int
                  constraints:
                    nullable: true
