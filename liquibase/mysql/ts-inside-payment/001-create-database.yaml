databaseChangeLog:
  - changeSet:
      id: create-ts-inside-payment-database
      author: devops
      comment: Create database for ts-inside-payment-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-inside-payment-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-inside-payment-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

