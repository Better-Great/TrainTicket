databaseChangeLog:
  - changeSet:
      id: create-ts-price-database
      author: devops
      comment: Create database for ts-price-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-price-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-price-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
