databaseChangeLog:
  - changeSet:
      id: create-ts-train-food-database
      author: devops
      comment: Create database for ts-train-food-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-train-food-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-train-food-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
