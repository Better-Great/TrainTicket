databaseChangeLog:
  - changeSet:
      id: create-ts-user-database
      author: devops
      comment: Create database for ts-user-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-user-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-user-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

