databaseChangeLog:
  - changeSet:
      id: create-ts-notification-database
      author: devops
      comment: Create database for ts-notification-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-notification-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-notification-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

