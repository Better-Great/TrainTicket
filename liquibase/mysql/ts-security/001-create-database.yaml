databaseChangeLog:
  - changeSet:
      id: create-ts-security-database
      author: devops
      comment: Create database for ts-security-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-security-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-security-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
