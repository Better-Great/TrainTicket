databaseChangeLog:
  - changeSet:
      id: create-ts-food-delivery-database
      author: devops
      comment: Create database for ts-food-delivery-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-food-delivery-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-food-delivery-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

