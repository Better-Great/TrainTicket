databaseChangeLog:
  - changeSet:
      id: create-ts-travel-database
      author: devops
      comment: Create database for ts-travel-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-travel-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-travel-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
