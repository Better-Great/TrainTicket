databaseChangeLog:
  - changeSet:
      id: create-ts-voucher-database
      author: devops
      comment: Create database for ts-voucher-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-voucher-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-voucher-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;
