databaseChangeLog:
  # ============================================================================
  # Create tables for ts-order-service
  # ============================================================================
  # Based on order.entity.Order entity:
  # - @Table(name = "orders")
  # ============================================================================

  - changeSet:
      id: create-orders-table
      author: devops
      comment: Create orders table for ts-order-service
      changes:
        - createTable:
            tableName: orders
            catalogName: ts-order-mysql
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: bought_date
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: travel_date
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: travel_time
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: account_id
                  type: varchar(36)
                  constraints:
                    nullable: true
              - column:
                  name: contacts_name
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: document_type
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: contacts_document_number
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: train_number
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: coach_number
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: seat_class
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: from_station
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: to_station
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: varchar(255)
                  constraints:
                    nullable: true

