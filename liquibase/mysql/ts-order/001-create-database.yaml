databaseChangeLog:
  - changeSet:
      id: create-ts-order-database
      author: devops
      comment: Create database for ts-order-service
      changes:
        - sql:
            sql: CREATE DATABASE IF NOT EXISTS `ts-order-mysql` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        - sql:
            sql: GRANT ALL PRIVILEGES ON `ts-order-mysql`.* TO 'beta'@'%';
        - sql:
            sql: FLUSH PRIVILEGES;

