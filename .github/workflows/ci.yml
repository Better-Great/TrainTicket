name: CI

on:
  push:
    branches: [main, feat]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so paths-filter can diff locally (no GitHub API).
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Git diff between base→ref avoids REST "list PR files" (unicorn/503 HTML failures).
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'pom.xml'
              - '**/pom.xml'
              - 'ts-*/**'
              - '!ts-ui-web/**'
              - '!ts-news-service/**'
              - '!ts-voucher-service/**'
              - '!ts-avatar-service/**'
              - '!ts-ticket-office-service/**'
              - 'ts-common/**'
              - 'ts-token-replacement-service/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'ts-ui-web/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Maven)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile (full reactor)
        run: mvn -B -T 2C compile

      - name: Test
        # -Djacoco.skip=true: jacoco-maven-plugin 0.8.2 predates Java 17 bytecode;
        # coverage isn't consumed downstream. Track a JaCoCo bump separately.
        run: mvn -B test -Djacoco.skip=true

  frontend:
    name: Frontend (Bun)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-ui-web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck + test + build
        run: bun run check
