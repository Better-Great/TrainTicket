name: CI

on:
  push:
    branches: [main, feat]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Local git diff only — no dorny/paths-filter, no GitHub "list PR files" API
      # (that API has been returning unicorn/503 HTML and failing the job).
      - name: Detect path filters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="${PR_BASE:-}"
            HEAD="${PR_HEAD:-$SHA}"
          else
            BASE="${BEFORE:-}"
            HEAD="$SHA"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — running all jobs"
            exit 0
          fi

          backend=false
          frontend=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                ;;
              .github/workflows/docker-publish.yml|pom.xml|*/pom.xml|ts-common/*|ts-token-replacement-service/*)
                backend=true
                ;;
              ts-ui-web/*)
                frontend=true
                ;;
              ts-news-service/*|ts-voucher-service/*|ts-avatar-service/*|ts-ticket-office-service/*)
                ;;
              ts-*-service/*)
                backend=true
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Diff $BASE..$HEAD → backend=$backend frontend=$frontend"

  backend:
    name: Backend (Maven)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile (full reactor)
        run: mvn -B -T 2C compile

      - name: Test
        # -Djacoco.skip=true: jacoco-maven-plugin 0.8.2 predates Java 17 bytecode;
        # coverage isn't consumed downstream. Track a JaCoCo bump separately.
        run: mvn -B test -Djacoco.skip=true

  frontend:
    name: Frontend (Bun)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-ui-web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck + test + build
        run: bun run check
