name: CI

on:
  push:
    branches: [main, feat]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Local git diff only — no dorny/paths-filter, no GitHub "list PR files" API
      # (that API has been returning unicorn/503 HTML and failing the job).
      - name: Detect path filters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="${PR_BASE:-}"
            HEAD="${PR_HEAD:-$SHA}"
          else
            BASE="${BEFORE:-}"
            HEAD="$SHA"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — running all jobs"
            exit 0
          fi

          backend=false
          frontend=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                ;;
              .github/workflows/docker-publish.yml|pom.xml|*/pom.xml|ts-common/*|ts-token-replacement-service/*)
                backend=true
                ;;
              ts-ui-web/*)
                frontend=true
                ;;
              ts-news-service/*|ts-voucher-service/*|ts-avatar-service/*|ts-ticket-office-service/*)
                ;;
              ts-*-service/*)
                backend=true
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Diff $BASE..$HEAD → backend=$backend frontend=$frontend"

  backend:
    name: Backend (Maven)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify with coverage
        run: mvn -B -ntp -T 2C verify

      - name: Upload JaCoCo XML reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-xml
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (Bun)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-ui-web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck + test + build
        run: bun run check
