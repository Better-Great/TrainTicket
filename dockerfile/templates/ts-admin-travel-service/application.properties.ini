server.port=${AdminTravelServicePort}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
spring.application.name=ts-admin-travel-service
swagger.controllerPackage=admintravel.controller

travel-service.url=http://${TravelServiceHost}:${TravelServicePort}
travel2-service.url=http://${Travel2ServiceHost}:${Travel2ServicePort}
station-service.url=http://${StationServiceHost}:${StationServicePort}
train-service.url=http://${TrainServiceHost}:${TrainServicePort}
route-service.url=http://${RouteServiceHost}:${RouteServicePort}
