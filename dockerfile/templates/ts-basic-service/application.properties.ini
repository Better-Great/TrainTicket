server.port=${BasicServicePort}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
spring.application.name=ts-basic-service
swagger.controllerPackage=fdse.microservice.controller

# Service URLs for inter-service communication (matching dev.application.ini pattern)
station-service.url=http://${StationServiceHost}:${StationServicePort}
train-service.url=http://${TrainServiceHost}:${TrainServicePort}
route-service.url=http://${RouteServiceHost}:${RouteServicePort}
price-service.url=http://${PriceServiceHost}:${PriceServicePort}