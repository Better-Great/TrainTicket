spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.application.name=ts-station-service
spring.datasource.url=jdbc:mysql://${StationMysqlHost}:${StationMysqlPort}/${StationMysqlDatabase}?useSSL=false
spring.datasource.username=${StationMysqlUser}
spring.datasource.password=${StationMysqlPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=${StationServicePort}
swagger.controllerPackage=fdse.microservice