spring.cloud.nacos.discovery.server-addr=${NacosAddrs}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.application.name=ts-consign-service
spring.datasource.url=jdbc:mysql://${ConsignMysqlHost}:${ConsignMysqlPort}/${ConsignMysqlDatabase}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=${ConsignMysqlUser}
spring.datasource.password=${ConsignMysqlPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
server.port=${ConsignServicePort}
swagger.controllerPackage=consign.controller

# Service URLs for inter-service communication (matching dev.application.ini pattern)
consign-price-service.url=http://${ConsignPriceServiceHost}:${ConsignPriceServicePort}