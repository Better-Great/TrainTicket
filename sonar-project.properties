sonar.projectKey=trainticket
sonar.projectName=TrainTicket
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Scan all supported source languages while excluding generated and vendored files.
sonar.sources=.
sonar.exclusions=**/target/**,**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**,**/legacy/**,**/src/test/**,**/*.test.ts,**/*.spec.ts,**/vendor/**,**/.mvn/wrapper/*.jar,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.ttf,**/*.eot,**/*.woff,**/*.woff2,**/*.otf
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.spec.ts

sonar.java.source=17
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml,**/target/jacoco-ut/jacoco.xml

sonar.javascript.lcov.reportPaths=ts-ui-web/coverage/lcov.info
sonar.typescript.tsconfigPaths=ts-ui-web/tsconfig.json
