worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
    }

    location ~* \.(html)$ {
      root /usr/share/nginx/html;
    }

    # Variable + Docker DNS (127.0.0.11) so nginx starts even when the gateway
    # host is not resolvable yet; resolves per request instead of at startup.
    location /api/v1/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $ts_gateway http://ts-gateway-service:18888;
      proxy_pass $ts_gateway;
    }
  }
}
