server:
  port: 15680

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-basic-service

swagger:
  controllerPackage: fdse.microservice.controller

# Cluster defaults = service DNS; local scripts set *_SERVICE_HOST=127.0.0.1
StationServiceHost: ${STATION_SERVICE_HOST:ts-station-service}
StationServicePort: ${STATION_SERVICE_PORT:12345}
TrainServiceHost: ${TRAIN_SERVICE_HOST:ts-train-service}
TrainServicePort: ${TRAIN_SERVICE_PORT:14567}
RouteServiceHost: ${ROUTE_SERVICE_HOST:ts-route-service}
RouteServicePort: ${ROUTE_SERVICE_PORT:11178}
PriceServiceHost: ${PRICE_SERVICE_HOST:ts-price-service}
PriceServicePort: ${PRICE_SERVICE_PORT:16579}
