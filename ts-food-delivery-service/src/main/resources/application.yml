server:
  port: 18957

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:127.0.0.1:8848}
  application:
    name: ts-food-delivery-service
  datasource:
    url: jdbc:mysql://${FOOD_DELIVERY_MYSQL_HOST:127.0.0.1}:${FOOD_DELIVERY_MYSQL_PORT:3307}/${FOOD_DELIVERY_MYSQL_DATABASE:ts-food-delivery-mysql}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${FOOD_DELIVERY_MYSQL_USER:root}
    password: ${FOOD_DELIVERY_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

swagger:
  controllerPackage: fooddelivery.controller
